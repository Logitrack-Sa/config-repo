spring.application.name=security-service
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8065/eureka/}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Redis Cache-Aside
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
server.error.include-message=never
server.error.include-stacktrace=never
logitrack.security.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
logitrack.security.key-id=${JWT_KEY_ID}
logitrack.security.issuer=${JWT_ISSUER}
logitrack.security.audience=${JWT_AUDIENCE}
logitrack.security.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
logitrack.security.token-ttl=${JWT_TTL:PT15M}
