spring.application.name=security-service
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.health.mail.enabled=false

# Redis Cache-Aside
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
server.error.include-message=never
server.error.include-stacktrace=never
logitrack.security.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
logitrack.security.key-id=${JWT_KEY_ID}
logitrack.security.issuer=${JWT_ISSUER}
logitrack.security.audience=${JWT_AUDIENCE}
logitrack.security.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
logitrack.security.token-ttl=${JWT_TTL:PT15M}

# Configuración de Envío de Correo (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logitrack.frontend.verification-url=${FRONTEND_URL:http://localhost:3000}/verify-email
