server.port=8083

spring.datasource.url=jdbc:mysql://security-db:3306/security_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#tiempo de expiración del token en milisegundos (1 día)
logitrack.security.jwt.expiration-ms=86400000
logitrack.security.jwt.issuer=logitrack-auth

logging.level.com.logitrack=DEBUG