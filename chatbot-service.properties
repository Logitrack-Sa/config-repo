spring.application.name=chatbot-service
server.port=${SERVER_PORT:8084}
logitrack.security.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
logitrack.security.issuer=${JWT_ISSUER:https://security-service}
logitrack.security.key-id=${JWT_KEY_ID:logitrack-main}
logitrack.security.audience=chatbot-service

eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8065/eureka/}
eureka.instance.appname=CHATBOT-SERVICE
eureka.instance.prefer-ip-address=true

spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.completions-path=${AI_COMPLETIONS_PATH:/v1/chat/completions}
spring.ai.openai.chat.options.model=${AI_MODEL}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
