name: Validar contrato dev y prod
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validar seis perfiles sin secretos
        run: python3 -m unittest discover -s tests -v
