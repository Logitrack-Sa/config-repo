server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://shipment-db:3306/shipment_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
logging.level.com.logitrack=INFO
logitrack.courier.base-url=${COURIER_SERVICE_URL:http://courier-service:8082}
logitrack.fee.base=${FEE_BASE:1000.00}
logitrack.fee.price-per-kg=${FEE_PRICE_PER_KG:250.00}
logitrack.fee.volumetric-divisor=${FEE_VOLUMETRIC_DIVISOR:5000}
