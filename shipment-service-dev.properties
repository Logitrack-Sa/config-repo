server.port=8080

# Conexión a MySQL usando el nombre DNS del contenedor
spring.datasource.url=jdbc:mysql://shipment-db:3306/shipment_db?useSSL=false&serverTimezone=UTC

# Placeholders para evitar secretos en Git
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Comunicación interna
logitrack.courier-service.url=http://courier-service:8081

# Logging y negocio
logging.level.com.logitrack=DEBUG
logitrack.fee.base=1000.00
logitrack.fee.price-per-kg=250.00
logitrack.fee.volumetric-divisor=5000