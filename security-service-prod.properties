server.port=8082

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

logitrack.security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
logitrack.security.jwt.issuer=logitrack-auth

logging.level.com.logitrack=INFO