server.port=8080

# Inyección total por variables de entorno para máxima seguridad
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

logitrack.courier-service.url=${COURIER_SERVICE_URL}

# Logging restrictivo
logging.level.com.logitrack=INFO

# Tarifas inyectables
logitrack.fee.base=${FEE_BASE}
logitrack.fee.price-per-kg=${FEE_PRICE_PER_KG}
logitrack.fee.volumetric-divisor=${FEE_VOLUMETRIC_DIVISOR}