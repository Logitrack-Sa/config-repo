spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.gateway.access=none
server.error.include-message=never
server.error.include-stacktrace=never

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Deduplicación perimetral de encabezados CORS para evitar respuestas duplicadas desde microservicios downstream
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST

# Rutas dinámicas hacia microservicios downstream vía Eureka (Spring Cloud LoadBalancer)
spring.cloud.gateway.server.webflux.routes[0].id=security-service-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://SECURITY-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**, /api/auth/**
spring.cloud.gateway.server.webflux.routes[0].order=100

spring.cloud.gateway.server.webflux.routes[1].id=security-service-users
spring.cloud.gateway.server.webflux.routes[1].uri=lb://SECURITY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**, /api/users/**
spring.cloud.gateway.server.webflux.routes[1].order=110

spring.cloud.gateway.server.webflux.routes[2].id=courier-service-couriers
spring.cloud.gateway.server.webflux.routes[2].uri=lb://COURIER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/couriers/**, /api/couriers/**
spring.cloud.gateway.server.webflux.routes[2].order=200

spring.cloud.gateway.server.webflux.routes[3].id=courier-service-internal
spring.cloud.gateway.server.webflux.routes[3].uri=lb://COURIER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/internal/couriers/**, /api/internal/couriers/**
spring.cloud.gateway.server.webflux.routes[3].order=210

spring.cloud.gateway.server.webflux.routes[4].id=shipment-service-shipments
spring.cloud.gateway.server.webflux.routes[4].uri=lb://SHIPMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/shipments/**, /api/shipments/**
spring.cloud.gateway.server.webflux.routes[4].order=300

spring.cloud.gateway.server.webflux.routes[5].id=shipment-service-customers
spring.cloud.gateway.server.webflux.routes[5].uri=lb://SHIPMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/customers/**, /api/customers/**
spring.cloud.gateway.server.webflux.routes[5].order=310

spring.cloud.gateway.server.webflux.routes[6].id=security-service-openapi
spring.cloud.gateway.server.webflux.routes[6].uri=lb://SECURITY-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/v3/api-docs/security-service
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/v3/api-docs/security-service, /v3/api-docs
spring.cloud.gateway.server.webflux.routes[6].order=400

spring.cloud.gateway.server.webflux.routes[7].id=courier-service-openapi
spring.cloud.gateway.server.webflux.routes[7].uri=lb://COURIER-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/v3/api-docs/courier-service
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/v3/api-docs/courier-service, /v3/api-docs
spring.cloud.gateway.server.webflux.routes[7].order=410

spring.cloud.gateway.server.webflux.routes[8].id=shipment-service-openapi
spring.cloud.gateway.server.webflux.routes[8].uri=lb://SHIPMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/v3/api-docs/shipment-service
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/v3/api-docs/shipment-service, /v3/api-docs
spring.cloud.gateway.server.webflux.routes[8].order=420

# Configuración perimetral de Cross-Origin Resource Sharing (CORS)
logitrack.gateway.cors.enabled=true
logitrack.gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173}
logitrack.gateway.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
logitrack.gateway.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,Access-Control-Request-Method,Access-Control-Request-Headers
logitrack.gateway.cors.exposed-headers=Authorization,Content-Disposition,X-User-Id,X-User-Roles
logitrack.gateway.cors.allow-credentials=true
logitrack.gateway.cors.max-age=3600

# Configuración de Seguridad Perimetral y Validación de JWT (Sprint 3)
logitrack.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
logitrack.security.jwt.issuer=${JWT_ISSUER}
logitrack.security.jwt.key-id=${JWT_KEY_ID}
logitrack.security.jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}
logitrack.security.jwt.audiences=${JWT_AUDIENCES:security-service,courier-service,shipment-service}
